<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzbekistan License Plate Generator</title>
    <!-- Avtoraqamlar uchun mos keladigan DIN 1451 shrifti -->
    <link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h2 {
            margin-bottom: 25px;
            font-weight: 600;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }
        input, select {
            padding: 12px 18px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #1e1e1e;
            color: #fff;
            outline: none;
            text-transform: uppercase;
        }
        input:focus, select:focus {
            border-color: #0088cc;
        }

        /* AVTORAQAM FREYMI */
        .plate-container {
            background: #ffffff;
            border: 4px solid #000000;
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            display: inline-block;
        }
        .plate {
            width: 450px;
            height: 95px;
            background-color: #ffffff;
            border: 2px solid #000000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* VILOYAT KODI BO'LIMI */
        .region-box {
            width: 85px;
            height: 100%;
            border-right: 3px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Oswald', sans-serif;
            font-size: 58px;
            font-weight: 700;
            color: #000000;
            letter-spacing: -1px;
            background: #fff;
        }

        /* RAQAM VA HARFLAR BO'LIMI */
        .number-box {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Oswald', sans-serif;
            font-size: 62px;
            font-weight: 700;
            color: #000000;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding-bottom: 4px;
        }

        /* BAYROQ VA UZ KODI */
        .flag-box {
            width: 55px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-right: 8px;
        }
        .flag-img {
            width: 38px;
            height: 20px;
            object-fit: cover;
            border: 1px solid #ccc;
            border-radius: 2px;
        }
        .uz-text {
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: 900;
            color: #0088cc;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        @media (max-width: 500px) {
            .plate {
                width: 340px;
                height: 75px;
            }
            .region-box {
                width: 65px;
                font-size: 42px;
            }
            .number-box {
                font-size: 44px;
                letter-spacing: 1px;
            }
            .flag-img {
                width: 28px;
                height: 15px;
            }
            .uz-text {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <h2>Oʻzbekiston Avtomobil Raqami Generatori</h2>

    <div class="controls">
        <select id="regionInput">
            <option value="01">01 - Toshkent sh.</option>
            <option value="10">10 - Toshkent vil.</option>
            <option value="20">20 - Sirdaryo</option>
            <option value="25">25 - Jizzax</option>
            <option value="30">30 - Samarqand</option>
            <option value="40">40 - Fargʻona</option>
            <option value="50">50 - Namangan</option>
            <option value="60">60 - Andijon</option>
            <option value="70">70 - Qashqadaryo</option>
            <option value="75">75 - Surxondaryo</option>
            <option value="80">80 - Buxoro</option>
            <option value="85">85 - Navoiy</option>
            <option value="90">90 - Xorazm</option>
            <option value="95" selected>95 - Qoraqalpogʻiston</option>
        </select>
        <input type="text" id="numberInput" placeholder="F 777 FF" maxlength="9" value="F 777 FF">
    </div>

    <!-- REALISTIK AVTORAQAM -->
    <div class="plate-container">
        <div class="plate">
            <div class="region-box" id="regionDisplay">95</div>
            <div class="number-box" id="numberDisplay">F 777 FF</div>
            <div class="flag-box">
                <!-- O'zbekiston bayrog'ining real rasmi -->
                <img class="flag-img" src="https://upload.wikimedia.org/wikipedia/commons/8/84/Flag_of_Uzbekistan.svg" alt="UZ Flag">
                <div class="uz-text">UZ</div>
            </div>
        </div>
    </div>

    <script>
        const regionInput = document.getElementById('regionInput');
        const numberInput = document.getElementById('numberInput');
        const regionDisplay = document.getElementById('regionDisplay');
        const numberDisplay = document.getElementById('numberDisplay');

        regionInput.addEventListener('change', () => {
            regionDisplay.textContent = regionInput.value;
        });

        numberInput.addEventListener('input', () => {
            numberDisplay.textContent = numberInput.value.toUpperCase() || '--- ---';
        });
    </script>
</body>
    </html>
