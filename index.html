<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzbekistan License Plate Generator</title>
    <style>
        /* Roadgeek va DIN shriftlariga alternativ maxsus avto-shrift */
        @import url('https://fonts.googleapis.com/css2?family=Changa:wght@700&family=M+PLUS+1Code:wght@700&display=swap');

        * {
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        input, select {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #222;
            color: #fff;
            text-transform: uppercase;
        }
        
        /* PLATESMANIA UZBEKISTAN PLATE DESIGN */
        .plate {
            width: 380px;
            height: 80px;
            background-color: #ffffff;
            border: 2px solid #000000;
            border-radius: 6px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: relative;
        }

        /* REGION SECTION */
        .region {
            width: 65px;
            height: 100%;
            border-right: 2px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Changa', 'M PLUS 1Code', monospace;
            font-size: 46px;
            font-weight: 700;
            color: #000000;
            letter-spacing: -2px;
        }

        /* NUMBER SECTION */
        .number {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Changa', 'M PLUS 1Code', monospace;
            font-size: 48px;
            font-weight: 700;
            color: #000000;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* FLAG & UZ SECTION */
        .flag-container {
            width: 45px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-right: 5px;
        }
        .flag {
            width: 32px;
            height: 16px;
            border: 1px solid #aaa;
            background: linear-gradient(
                to bottom, 
                #0099b5 0%, #0099b5 30%, 
                #ce1126 30%, #ce1126 35%, 
                #ffffff 35%, #ffffff 65%, 
                #ce1126 65%, #ce1126 70%, 
                #1eb53a 70%, #1eb53a 100%
            );
        }
        .uz-code {
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            color: #0088cc;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <h2>Oʻzbekiston Avtomobil Raqami Generatori</h2>

    <div class="controls">
        <select id="regionInput">
            <option value="01">01</option>
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="25">25</option>
            <option value="30">30</option>
            <option value="40">40</option>
            <option value="50">50</option>
            <option value="60">60</option>
            <option value="70">70</option>
            <option value="75">75</option>
            <option value="80">80</option>
            <option value="85">85</option>
            <option value="90">90</option>
            <option value="95" selected>95</option>
        </select>
        <input type="text" id="numberInput" placeholder="R 010 RR" maxlength="8" value="R 010 RR">
    </div>

    <div class="plate">
        <div class="region" id="regionDisplay">95</div>
        <div class="number" id="numberDisplay">R 010 RR</div>
        <div class="flag-container">
            <div class="flag"></div>
            <div class="uz-code">UZ</div>
        </div>
    </div>

    <script>
        const regionInput = document.getElementById('regionInput');
        const numberInput = document.getElementById('numberInput');
        const regionDisplay = document.getElementById('regionDisplay');
        const numberDisplay = document.getElementById('numberDisplay');

        regionInput.addEventListener('change', () => {
            regionDisplay.textContent = regionInput.value;
        });

        numberInput.addEventListener('input', () => {
            numberDisplay.textContent = numberInput.value.toUpperCase() || '--- ---';
        });
    </script>
</body>
</html>
