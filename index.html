<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oʻzbekiston Avtomobil Raqami Generatori</title>
    <style>
        /* REPO ILDIZIDAGI PlateFont SHIFTINI ULASH */
        @font-face {
            font-family: 'PlateFont';
            src: url('./PlateFont.woff') format('woff'),
                 url('./PlateFont.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 18px;
            text-align: center;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 420px;
        }
        input, select {
            padding: 10px 12px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: #fff;
            outline: none;
            text-transform: uppercase;
        }
        select {
            width: 80px;
        }
        input {
            flex: 1;
        }

        /* AVTORAQAM KONTURI (EKRANGA MOSLASHUVCHAN) */
        .plate {
            width: 100%;
            max-width: 440px;
            height: 90px;
            background-color: #ffffff;
            border: 4px solid #000000;
            border-radius: 10px;
            display: flex;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        /* VILOYAT KODI (O'LCHAMI VA MASOFASI SOZLANGAN) */
        .region {
            width: 75px;
            height: 100%;
            border-right: 4px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'PlateFont', sans-serif;
            font-size: 58px;
            color: #000000;
            line-height: 1;
            flex-shrink: 0;
        }

        /* ASOSIY RAQAM VA HARFLAR */
        .number {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'PlateFont', sans-serif;
            font-size: 58px;
            color: #000000;
            letter-spacing: 0px;
            text-transform: uppercase;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            padding: 0 5px;
        }

        /* BAYROQ VA UZ KODI */
        .flag-container {
            width: 50px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-right: 4px;
            flex-shrink: 0;
        }
        .flag {
            width: 36px;
            height: 18px;
            border: 1px solid #888;
            background: linear-gradient(
                to bottom, 
                #0099b5 0%, #0099b5 30%, 
                #ce1126 30%, #ce1126 35%, 
                #ffffff 35%, #ffffff 65%, 
                #ce1126 65%, #ce1126 70%, 
                #1eb53a 70%, #1eb53a 100%
            );
        }
        .uz-code {
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: 900;
            color: #0088cc;
            margin-top: 2px;
        }

        /* KICHIK EKRANLAR (TELEFONLAR) UCHUN PROPORTSIYA */
        @media (max-width: 420px) {
            .plate {
                height: 76px;
            }
            .region {
                width: 62px;
                font-size: 48px;
            }
            .number {
                font-size: 48px;
            }
            .flag {
                width: 30px;
                height: 15px;
            }
            .uz-code {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <h2>Oʻzbekiston Avtomobil Raqami Generatori</h2>

    <div class="controls">
        <select id="regionInput">
            <option value="01">01</option>
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="25">25</option>
            <option value="30">30</option>
            <option value="40">40</option>
            <option value="50">50</option>
            <option value="60">60</option>
            <option value="70">70</option>
            <option value="75">75</option>
            <option value="80">80</option>
            <option value="85">85</option>
            <option value="90">90</option>
            <option value="95" selected>95</option>
        </select>
        <input type="text" id="numberInput" placeholder="010 RRR" maxlength="9" value="010 RRR">
    </div>

    <div class="plate">
        <div class="region" id="regionDisplay">95</div>
        <div class="number" id="numberDisplay">010 RRR</div>
        <div class="flag-container">
            <div class="flag"></div>
            <div class="uz-code">UZ</div>
        </div>
    </div>

    <script>
        const regionInput = document.getElementById('regionInput');
        const numberInput = document.getElementById('numberInput');
        const regionDisplay = document.getElementById('regionDisplay');
        const numberDisplay = document.getElementById('numberDisplay');

        function updatePlate() {
            regionDisplay.textContent = regionInput.value;
            numberDisplay.textContent = numberInput.value.toUpperCase() || '--- ---';
        }

        regionInput.addEventListener('change', updatePlate);
        numberInput.addEventListener('input', updatePlate);
    </script>
</body>
                </html>
