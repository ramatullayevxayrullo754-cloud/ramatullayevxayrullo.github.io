<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oʻzbekiston Avtomobil Raqami Generatori</title>
    <style>
        /* HAQIQIY FE-SCHRIFT (O'ng tepasi kesilgan 0 shrifti) */
        @font-face {
            font-family: 'FESchrift';
            src: url('https://cdn.jsdelivr.net/gh/glin/fe-schrift/FE-Schrift.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/gh/glin/fe-schrift/FE-Schrift.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h2 {
            margin-bottom: 25px;
            font-size: 20px;
            text-align: center;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input, select {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: #fff;
            outline: none;
            text-transform: uppercase;
        }

        /* AVTORAQAM KONTURI */
        .plate {
            width: 460px;
            height: 96px;
            background-color: #ffffff;
            border: 3.5px solid #000000;
            border-radius: 10px;
            display: flex;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* VILOYAT KODI */
        .region {
            width: 85px;
            height: 100%;
            border-right: 3.5px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'FESchrift', sans-serif;
            font-size: 68px;
            color: #000000;
            line-height: 1;
            letter-spacing: -1px;
            padding-top: 4px;
        }

        /* ASOSIY RAQAM VA HARFLAR */
        .number {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'FESchrift', sans-serif;
            font-size: 68px;
            color: #000000;
            letter-spacing: 3px;
            text-transform: uppercase;
            line-height: 1;
            padding-top: 4px;
        }

        /* BAYROQ VA UZ KODI */
        .flag-container {
            width: 55px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-right: 6px;
        }
        .flag {
            width: 40px;
            height: 20px;
            border: 1px solid #999;
            background: linear-gradient(
                to bottom, 
                #0099b5 0%, #0099b5 30%, 
                #ce1126 30%, #ce1126 35%, 
                #ffffff 35%, #ffffff 65%, 
                #ce1126 65%, #ce1126 70%, 
                #1eb53a 70%, #1eb53a 100%
            );
        }
        .uz-code {
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            color: #0088cc;
            margin-top: 3px;
        }

        @media (max-width: 500px) {
            .plate {
                width: 340px;
                height: 72px;
            }
            .region {
                width: 63px;
                font-size: 50px;
            }
            .number {
                font-size: 50px;
                letter-spacing: 1px;
            }
            .flag {
                width: 28px;
                height: 14px;
            }
            .uz-code {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <h2>Oʻzbekiston Avtomobil Raqami Generatori</h2>

    <div class="controls">
        <select id="regionInput">
            <option value="01">01</option>
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="25">25</option>
            <option value="30">30</option>
            <option value="40">40</option>
            <option value="50">50</option>
            <option value="60">60</option>
            <option value="70">70</option>
            <option value="75">75</option>
            <option value="80">80</option>
            <option value="85">85</option>
            <option value="90">90</option>
            <option value="95" selected>95</option>
        </select>
        <input type="text" id="numberInput" placeholder="R 010 RR" maxlength="9" value="R 010 RR">
    </div>

    <div class="plate">
        <div class="region" id="regionDisplay">95</div>
        <div class="number" id="numberDisplay">R 010 RR</div>
        <div class="flag-container">
            <div class="flag"></div>
            <div class="uz-code">UZ</div>
        </div>
    </div>

    <script>
        const regionInput = document.getElementById('regionInput');
        const numberInput = document.getElementById('numberInput');
        const regionDisplay = document.getElementById('regionDisplay');
        const numberDisplay = document.getElementById('numberDisplay');

        regionInput.addEventListener('change', () => {
            regionDisplay.textContent = regionInput.value;
        });

        numberInput.addEventListener('input', () => {
            numberDisplay.textContent = numberInput.value.toUpperCase() || '--- ---';
        });
    </script>
</body>
                </html>
