<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzbekistan License Plate Generator</title>
    <style>
        /* HAQIQIY DIN 1451 SHRIFTINI INTERNETDAN DIREKT ULASH */
        @font-face {
            font-family: 'DIN1451Real';
            src: url('https://db.onlinewebfonts.com/t/0858177517601b31a26d7e0081d5f3df.woff2') format('woff2'),
                 url('https://db.onlinewebfonts.com/t/0858177517601b31a26d7e0081d5f3df.woff') format('woff');
            font-weight: bold;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h2 {
            margin-bottom: 25px;
            font-weight: 600;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }
        input, select {
            padding: 12px 18px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #1e1e1e;
            color: #fff;
            outline: none;
            text-transform: uppercase;
        }
        input:focus, select:focus {
            border-color: #0088cc;
        }

        /* AVTORAQAM KONTURI */
        .plate {
            width: 440px;
            height: 95px;
            background-color: #ffffff;
            border: 3.5px solid #000000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            padding: 0;
            overflow: hidden;
        }

        /* VILOYAT KODI (HAQIQIY DIN 1451 SHRIFTI) */
        .region {
            width: 80px;
            height: 100%;
            border-right: 3.5px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DIN1451Real', 'Arial Narrow', sans-serif;
            font-size: 68px;
            font-weight: bold;
            color: #000000;
            line-height: 1;
        }

        /* RAQAM VA HARFLAR (HAQIQIY DIN 1451 SHRIFTI) */
        .number {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DIN1451Real', 'Arial Narrow', sans-serif;
            font-size: 70px;
            font-weight: bold;
            color: #000000;
            letter-spacing: 4px;
            text-transform: uppercase;
            line-height: 1;
        }

        /* BAYROQ VA UZ KODI */
        .flag-container {
            width: 50px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-right: 5px;
        }
        .flag {
            width: 38px;
            height: 19px;
            border: 1px solid #999;
            background: linear-gradient(
                to bottom, 
                #0099b5 0%, #0099b5 30%, 
                #ce1126 30%, #ce1126 35%, 
                #ffffff 35%, #ffffff 65%, 
                #ce1126 65%, #ce1126 70%, 
                #1eb53a 70%, #1eb53a 100%
            );
        }
        .uz-code {
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            color: #0088cc;
            margin-top: 3px;
        }

        @media (max-width: 500px) {
            .plate {
                width: 330px;
                height: 72px;
            }
            .region {
                width: 60px;
                font-size: 50px;
            }
            .number {
                font-size: 52px;
                letter-spacing: 2px;
            }
            .flag {
                width: 28px;
                height: 14px;
            }
            .uz-code {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <h2>Oʻzbekiston Avtomobil Raqami Generatori</h2>

    <div class="controls">
        <select id="regionInput">
            <option value="01">01 - Toshkent sh.</option>
            <option value="10">10 - Toshkent vil.</option>
            <option value="20">20 - Sirdaryo</option>
            <option value="25">25 - Jizzax</option>
            <option value="30">30 - Samarqand</option>
            <option value="40">40 - Fargʻona</option>
            <option value="50">50 - Namangan</option>
            <option value="60">60 - Andijon</option>
            <option value="70">70 - Qashqadaryo</option>
            <option value="75">75 - Surxondaryo</option>
            <option value="80">80 - Buxoro</option>
            <option value="85">85 - Navoiy</option>
            <option value="90">90 - Xorazm</option>
            <option value="95" selected>95 - Qoraqalpogʻiston</option>
        </select>
        <input type="text" id="numberInput" placeholder="R 010 RR" maxlength="9" value="R 010 RR">
    </div>

    <!-- AVTORAQAM -->
    <div class="plate">
        <div class="region" id="regionDisplay">95</div>
        <div class="number" id="numberDisplay">R 010 RR</div>
        <div class="flag-container">
            <div class="flag"></div>
            <div class="uz-code">UZ</div>
        </div>
    </div>

    <script>
        const regionInput = document.getElementById('regionInput');
        const numberInput = document.getElementById('numberInput');
        const regionDisplay = document.getElementById('regionDisplay');
        const numberDisplay = document.getElementById('numberDisplay');

        regionInput.addEventListener('change', () => {
            regionDisplay.textContent = regionInput.value;
        });

        numberInput.addEventListener('input', () => {
            numberDisplay.textContent = numberInput.value.toUpperCase() || '--- ---';
        });
    </script>
</body>
    </html>
