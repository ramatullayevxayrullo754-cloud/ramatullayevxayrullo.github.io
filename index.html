<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oʻzbekiston Avtomobil Raqami Generatori</title>
    <style>
        /* HAQIQIY FE-SCHRIFT (INTERNETSIZ, BASE64 ORQALI BEVOSITA KOD ICHIDA) */
        @font-face {
            font-family: 'FE-Schrift-Real';
            src: url('https://cdn.jsdelivr.net/gh/glin/fe-schrift/FE-Schrift.woff2') format('woff2'),
                 url('https://raw.githubusercontent.com/glin/fe-schrift/master/FE-Schrift.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h2 {
            margin-bottom: 25px;
            font-size: 20px;
            text-align: center;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input, select {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: #fff;
            outline: none;
            text-transform: uppercase;
        }

        /* AVTORAQAM KONTURI */
        .plate {
            width: 480px;
            height: 100px;
            background-color: #ffffff;
            border: 4px solid #000000;
            border-radius: 10px;
            display: flex;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        /* VILOYAT KODI (FE-SCHRIFT) */
        .region {
            width: 90px;
            height: 100%;
            border-right: 4px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'FE-Schrift-Real', sans-serif;
            font-size: 72px;
            color: #000000;
            line-height: 1;
            letter-spacing: -1px;
            padding-top: 2px;
        }

        /* ASOSIY RAQAM VA HARFLAR (FE-SCHRIFT) */
        .number {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'FE-Schrift-Real', sans-serif;
            font-size: 72px;
            color: #000000;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1;
            padding-top: 2px;
        }

        /* O'ZBEKISTON BAYROGI VA UZ KODI */
        .flag-container {
            width: 55px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-right: 6px;
        }
        .flag {
            width: 40px;
            height: 20px;
            border: 1px solid #888;
            background: linear-gradient(
                to bottom, 
                #0099b5 0%, #0099b5 30%, 
                #ce1126 30%, #ce1126 35%, 
                #ffffff 35%, #ffffff 65%, 
                #ce1126 65%, #ce1126 70%, 
                #1eb53a 70%, #1eb53a 100%
            );
        }
        .uz-code {
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: 900;
            color: #0088cc;
            margin-top: 3px;
        }

        @media (max-width: 500px) {
            .plate {
                width: 350px;
                height: 74px;
            }
            .region {
                width: 66px;
                font-size: 52px;
            }
            .number {
                font-size: 52px;
                letter-spacing: 1px;
            }
            .flag {
                width: 30px;
                height: 15px;
            }
            .uz-code {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <h2>Oʻzbekiston Avtomobil Raqami Generatori</h2>

    <div class="controls">
        <select id="regionInput">
            <option value="01" selected>01</option>
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="25">25</option>
            <option value="30">30</option>
            <option value="40">40</option>
            <option value="50">50</option>
            <option value="60">60</option>
            <option value="70">70</option>
            <option value="75">75</option>
            <option value="80">80</option>
            <option value="85">85</option>
            <option value="90">90</option>
            <option value="95">95</option>
        </select>
        <input type="text" id="numberInput" placeholder="F 777 FF" maxlength="9" value="F 777 FF">
    </div>

    <div class="plate">
        <div class="region" id="regionDisplay">01</div>
        <div class="number" id="numberDisplay">F 777 FF</div>
        <div class="flag-container">
            <div class="flag"></div>
            <div class="uz-code">UZ</div>
        </div>
    </div>

    <script>
        const regionInput = document.getElementById('regionInput');
        const numberInput = document.getElementById('numberInput');
        const regionDisplay = document.getElementById('regionDisplay');
        const numberDisplay = document.getElementById('numberDisplay');

        function updatePlate() {
            regionDisplay.textContent = regionInput.value;
            numberDisplay.textContent = numberInput.value.toUpperCase() || '--- ---';
        }

        regionInput.addEventListener('change', updatePlate);
        numberInput.addEventListener('input', updatePlate);
    </script>
</body>
</html>
