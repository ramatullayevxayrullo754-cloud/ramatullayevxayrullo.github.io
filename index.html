<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzbekistan License Plate Generator</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h2 {
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        input, select {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            text-transform: uppercase;
        }
        .plate {
            width: 380px;
            height: 80px;
            background-color: #ffffff;
            border: 3px solid #000000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .region {
            width: 65px;
            height: 100%;
            border-right: 2px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
            color: #000000;
        }
        .number-sec {
            flex-grow: 1;
            text-align: center;
            font-size: 42px;
            font-weight: 900;
            color: #000000;
            letter-spacing: 2px;
        }
        .flag-sec {
            width: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .uz-text {
            font-size: 12px;
            font-weight: bold;
            color: #000000;
            margin-top: 2px;
        }
        .flag {
            width: 25px;
            height: 14px;
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
        }
        .flag-blue { background-color: #0099b5; height: 33.3%; }
        .flag-white { background-color: #ffffff; height: 33.3%; }
        .flag-green { background-color: #1eb53a; height: 33.3%; }
    </style>
</head>
<body>

    <h2>Oʻzbekiston Avtomobil Raqami Generatori</h2>

    <div class="controls">
        <select id="regionInput">
            <option value="01">01 - Toshkent shahri</option>
            <option value="10">10 - Toshkent viloyati</option>
            <option value="20">20 - Sirdaryo</option>
            <option value="25">25 - Jizzax</option>
            <option value="30">30 - Samarqand</option>
            <option value="40">40 - Fargʻona</option>
            <option value="50">50 - Namangan</option>
            <option value="60">60 - Andijon</option>
            <option value="70">70 - Qashqadaryo</option>
            <option value="75">75 - Surxondaryo</option>
            <option value="80">80 - Buxoro</option>
            <option value="85">85 - Navoiy</option>
            <option value="90">90 - Xorazm</option>
            <option value="95">95 - Qoraqalpogʻiston</option>
        </select>
        <input type="text" id="numberInput" placeholder="A 777 AA" maxlength="8" value="777 AAA">
    </div>

    <!-- Avtomobil Raqami -->
    <div class="plate">
        <div class="region" id="regionDisplay">01</div>
        <div class="number-sec" id="numberDisplay">777 AAA</div>
        <div class="flag-sec">
            <div class="flag">
                <div class="flag-blue"></div>
                <div class="flag-white"></div>
                <div class="flag-green"></div>
            </div>
            <div class="uz-text">UZ</div>
        </div>
    </div>

    <script>
        const regionInput = document.getElementById('regionInput');
        const numberInput = document.getElementById('numberInput');
        const regionDisplay = document.getElementById('regionDisplay');
        const numberDisplay = document.getElementById('numberDisplay');

        regionInput.addEventListener('change', () => {
            regionDisplay.textContent = regionInput.value;
        });

        numberInput.addEventListener('input', () => {
            numberDisplay.textContent = numberInput.value.toUpperCase() || '--- ---';
        });
    </script>
</body>
  </html>
