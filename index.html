<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oʻzbekiston Avtomobil Raqami Generatori</title>
    <style>
        /* REPO ILDIZIDAGI PlateFont SHIFTINI ULASH */
        @font-face {
            font-family: 'PlateFont';
            src: url('./PlateFont.woff') format('woff'),
                 url('./PlateFont.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 18px;
            text-align: center;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 500px;
        }
        input, select {
            padding: 10px 12px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: #fff;
            outline: none;
            text-transform: uppercase;
        }
        select {
            width: 85px;
        }
        input {
            flex: 1;
        }

        /* AVTORAQAM KONTURI (CPM PROPORTSIYASI) */
        .plate {
            width: 100%;
            max-width: 520px;
            height: 100px;
            background-color: #ffffff;
            border: 3.5px solid #000000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        /* VILOYAT KODI (O'YIN DAGI DEK KATTA VA BOLD) */
        .region {
            width: 90px;
            height: 100%;
            border-right: 3.5px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'PlateFont', sans-serif;
            font-size: 52px;
            color: #000000;
            line-height: 1;
            flex-shrink: 0;
            padding-top: 12px; /* Tepadagi kesilishni tekislash */
        }

        /* ASOSIY RAQAM BO'LIMI */
        .number {
            flex: 1;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'PlateFont', sans-serif;
            font-size: 52px;
            color: #000000;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1;
            white-space: nowrap;
            padding-top: 12px; /* Tepadagi kesilishni tekislash */
        }

        /* O'NG TOMON: BAYROQ, QR-KOD VA UZ YUZASI */
        .flag-container {
            width: 55px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            padding: 4px 2px;
            flex-shrink: 0;
        }
        .flag {
            width: 38px;
            height: 19px;
            border: 0.5px solid #888;
            background: linear-gradient(
                to bottom, 
                #0099b5 0%, #0099b5 30%, 
                #ce1126 30%, #ce1126 35%, 
                #ffffff 35%, #ffffff 65%, 
                #ce1126 65%, #ce1126 70%, 
                #1eb53a 70%, #1eb53a 100%
            );
        }
        /* REAL AVTORAQAMLARDAGI QR-KOD SIMITSIYASI */
        .qr-code {
            width: 16px;
            height: 16px;
            background-color: #000;
            background-image: 
                radial-gradient(#fff 20%, transparent 20%),
                radial-gradient(#fff 20%, transparent 20%);
            background-size: 6px 6px;
            background-position: 0 0, 3px 3px;
            opacity: 0.85;
        }
        .uz-code {
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: 900;
            color: #0088cc;
            line-height: 1;
        }

        /* TELEFON EKRANI UCHUN MOSLASHUV (RESPONSIVE) */
        @media (max-width: 520px) {
            .plate {
                height: 80px;
            }
            .region {
                width: 72px;
                font-size: 42px;
                padding-top: 9px;
            }
            .number {
                font-size: 42px;
                letter-spacing: 1px;
                padding-top: 9px;
            }
            .flag-container {
                width: 44px;
            }
            .flag {
                width: 30px;
                height: 15px;
            }
            .qr-code {
                width: 13px;
                height: 13px;
            }
            .uz-code {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <h2>Oʻzbekiston Avtomobil Raqami Generatori</h2>

    <div class="controls">
        <select id="regionInput">
            <option value="01">01</option>
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="25">25</option>
            <option value="30">30</option>
            <option value="40">40</option>
            <option value="50">50</option>
            <option value="60">60</option>
            <option value="70">70</option>
            <option value="75">75</option>
            <option value="80">80</option>
            <option value="85">85</option>
            <option value="90">90</option>
            <option value="95" selected>95</option>
        </select>
        <input type="text" id="numberInput" placeholder="R 010 RR" maxlength="9" value="R 010 RR">
    </div>

    <div class="plate">
        <div class="region" id="regionDisplay">95</div>
        <div class="number" id="numberDisplay">R 010 RR</div>
        <div class="flag-container">
            <div class="flag"></div>
            <div class="qr-code"></div>
            <div class="uz-code">UZ</div>
        </div>
    </div>

    <script>
        const regionInput = document.getElementById('regionInput');
        const numberInput = document.getElementById('numberInput');
        const regionDisplay = document.getElementById('regionDisplay');
        const numberDisplay = document.getElementById('numberDisplay');

        function updatePlate() {
            regionDisplay.textContent = regionInput.value;
            numberDisplay.textContent = numberInput.value.toUpperCase() || '--- ---';
        }

        regionInput.addEventListener('change', updatePlate);
        numberInput.addEventListener('input', updatePlate);
    </script>
</body>
</html>
