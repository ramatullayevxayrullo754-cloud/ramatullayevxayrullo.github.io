<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oʻzbekiston Avtomobil Raqami Generatori</title>
    <style>
        @font-face {
            font-family: 'PlateFont';
            src: url('./PlateFont.woff') format('woff'),
                 url('./PlateFont.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 18px;
            text-align: center;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 520px;
        }
        input, select {
            padding: 10px 12px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: #fff;
            outline: none;
            text-transform: uppercase;
        }
        select {
            width: 85px;
        }
        input {
            flex: 1;
        }

        /* AVTORAQAM KONTURI */
        .plate {
            width: 100%;
            max-width: 520px;
            height: 100px;
            background-color: #ffffff;
            border: 3.5px solid #000000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .region {
            width: 90px;
            height: 100%;
            border-right: 3.5px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'PlateFont', sans-serif;
            font-size: 52px;
            color: #000000;
            line-height: 1;
            flex-shrink: 0;
            padding-top: 12px;
        }

        .number {
            flex: 1;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'PlateFont', sans-serif;
            font-size: 52px;
            color: #000000;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1;
            white-space: nowrap;
            padding-top: 12px;
        }

        .flag-container {
            width: 55px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            padding: 4px 2px;
            flex-shrink: 0;
        }
        .flag {
            width: 38px;
            height: 19px;
            border: 0.5px solid #888;
            background: linear-gradient(
                to bottom, 
                #0099b5 0%, #0099b5 30%, 
                #ce1126 30%, #ce1126 35%, 
                #ffffff 35%, #ffffff 65%, 
                #ce1126 65%, #ce1126 70%, 
                #1eb53a 70%, #1eb53a 100%
            );
        }
        .qr-code {
            width: 16px;
            height: 16px;
            background-color: #000;
            background-image: 
                radial-gradient(#fff 20%, transparent 20%),
                radial-gradient(#fff 20%, transparent 20%);
            background-size: 6px 6px;
            background-position: 0 0, 3px 3px;
            opacity: 0.85;
        }
        .uz-code {
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: 900;
            color: #0088cc;
            line-height: 1;
        }

        /* MA'LUMOT VA NARX PANELI */
        .info-box {
            width: 100%;
            max-width: 520px;
            margin-top: 20px;
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 8px;
        }
        .info-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .info-label {
            color: #aaa;
        }
        .info-value {
            font-weight: 600;
        }
        .status-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
        }
        .status-taken {
            background-color: rgba(255, 77, 77, 0.15);
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
        }
        .status-free {
            background-color: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }

        @media (max-width: 520px) {
            .plate { height: 80px; }
            .region { width: 72px; font-size: 42px; padding-top: 9px; }
            .number { font-size: 42px; letter-spacing: 1px; padding-top: 9px; }
            .flag-container { width: 44px; }
            .flag { width: 30px; height: 15px; }
            .qr-code { width: 13px; height: 13px; }
            .uz-code { font-size: 11px; }
            .info-box { padding: 12px; }
            .info-item { font-size: 14px; }
        }
    </style>
</head>
<body>

    <h2>Oʻzbekiston Avtomobil Raqami Generatori</h2>

    <div class="controls">
        <select id="regionInput">
            <option value="01">01</option>
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="25">25</option>
            <option value="30">30</option>
            <option value="40">40</option>
            <option value="50">50</option>
            <option value="60">60</option>
            <option value="70">70</option>
            <option value="75">75</option>
            <option value="80">80</option>
            <option value="85">85</option>
            <option value="90">90</option>
            <option value="95" selected>95</option>
        </select>
        <!-- MAXLENGTH 6 QILIB BELGILANDI -->
        <input type="text" id="numberInput" placeholder="DILIME" maxlength="6" value="DILIME">
    </div>

    <div class="plate">
        <div class="region" id="regionDisplay">95</div>
        <div class="number" id="numberDisplay">DILIME</div>
        <div class="flag-container">
            <div class="flag"></div>
            <div class="qr-code"></div>
            <div class="uz-code">UZ</div>
        </div>
    </div>

    <!-- MA'LUMOT VA NARX BLOKI -->
    <div class="info-box">
        <div class="info-item">
            <span class="info-label">Raqam holati:</span>
            <span id="statusDisplay" class="status-badge status-taken">🔴 Band (Egasi bor)</span>
        </div>
        <div class="info-item">
            <span class="info-label">Bozor qiymati:</span>
            <span id="priceDisplay" class="info-value">20 000 000 soʻm</span>
        </div>
    </div>

    <script>
        const regionInput = document.getElementById('regionInput');
        const numberInput = document.getElementById('numberInput');
        const regionDisplay = document.getElementById('regionDisplay');
        const numberDisplay = document.getElementById('numberDisplay');
        const statusDisplay = document.getElementById('statusDisplay');
        const priceDisplay = document.getElementById('priceDisplay');

        function getStringHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash << 5) - hash + str.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash);
        }

        function calculatePlateInfo(region, rawNumber) {
            // 6 tadan ortiq kiritishning oldini olish
            const cleanNum = rawNumber.toUpperCase().substring(0, 6);
            const fullPlate = region + cleanNum;
            const hash = getStringHash(fullPlate);

            const isTaken = hash % 3 !== 0;

            // Minimal narx 20 mln so'm qilib belgilandi
            let priceSom = 20000000; 

            // Agar maxsus so'z (masalan DILIME) yoki harflar ko'p bo'lsa narx oshadi
            if (cleanNum === "DILIME") {
                priceSom = 120000000;
            } else if (cleanNum.length >= 4) {
                priceSom = 20000000 + (hash % 40000000); // 20 mln dan 60 mln gacha
            } else {
                priceSom = 20000000 + (hash % 10000000); // 20 mln dan 30 mln gacha
            }

            const priceUSD = Math.round(priceSom / 12800);
            const formattedSom = priceSom.toLocaleString('uz-UZ') + " soʻm";

            return {
                isTaken: isTaken,
                priceStr: `${formattedSom} (~$${priceUSD.toLocaleString()})`
            };
        }

        function updatePlate() {
            // Input qiymatini doim 6 taga cheklash
            if (numberInput.value.length > 6) {
                numberInput.value = numberInput.value.substring(0, 6);
            }

            const reg = regionInput.value;
            const numVal = numberInput.value.toUpperCase() || '---';

            regionDisplay.textContent = reg;
            numberDisplay.textContent = numVal;

            if (numVal.length > 0) {
                const info = calculatePlateInfo(reg, numVal);

                if (info.isTaken) {
                    statusDisplay.textContent = "🔴 Band (Egasi bor)";
                    statusDisplay.className = "status-badge status-taken";
                } else {
                    statusDisplay.textContent = "🟢 Band emas";
                    statusDisplay.className = "status-badge status-free";
                }

                priceDisplay.textContent = info.priceStr;
            } else {
                statusDisplay.textContent = "Kiritilmagan";
                statusDisplay.className = "status-badge";
                priceDisplay.textContent = "0 soʻm";
            }
        }

        regionInput.addEventListener('change', updatePlate);
        numberInput.addEventListener('input', updatePlate);

        updatePlate();
    </script>
</body>
</html>
